name: Abi teavitus

on:
  issues:
    types: [labeled, opened]

permissions:
  issues: write
  contents: read

jobs:
  abi:
    if: contains(github.event.issue.labels.*.name, 'abi')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/github-script@v7
        with:
          script: |
            const cfg = JSON.parse(require('fs').readFileSync('.github/ulesanded.json', 'utf8'));
            const { owner, repo } = context.repo;
            const n = context.payload.issue.number;
            const k = await github.rest.issues.listComments({ owner, repo, issue_number: n });
            if (k.data.some(c => (c.body || '').includes('abipäring'))) return;
            await github.rest.issues.createComment({ owner, repo, issue_number: n,
              body: `@${cfg.juhendaja} - abipäring. Kirjelda, mida proovisid ja mis veateade tuli.` });
