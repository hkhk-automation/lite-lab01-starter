name: Ava ülesanded

# Loob .github/ulesanded.json põhjal issue'd (kontrollnimekiri).
# Käivitub õppija esimesel push'il; olemasolevaid issue'sid ei dubleeri.
# Käsitsi: Actions -> Ava ülesanded -> Run workflow.

on:
  push:
  workflow_dispatch:

permissions:
  issues: write
  contents: read

jobs:
  ava:
    runs-on: ubuntu-latest
    if: github.actor != 'github-classroom[bot]'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const cfg = JSON.parse(fs.readFileSync('.github/ulesanded.json', 'utf8'));
            const { owner, repo } = context.repo;

            const sildid = [
              ['klassitöö', '1d76db'],
              ['kodutöö', 'fbca04'],
              ['abi', 'e11d21'],
            ];
            for (const [name, color] of sildid) {
              try { await github.rest.issues.createLabel({ owner, repo, name, color }); }
              catch (e) { if (e.status !== 422) throw e; }
            }

            const olemas = await github.paginate(github.rest.issues.listForRepo,
              { owner, repo, state: 'all', per_page: 100 });
            const pealkirjad = new Set(olemas.filter(i => !i.pull_request).map(i => i.title));

            let uusi = 0;
            for (const u of cfg.ulesanded) {
              if (pealkirjad.has(u.pealkiri)) continue;
              await github.rest.issues.create({
                owner, repo, title: u.pealkiri, body: u.keha, labels: [u.silt],
              });
              uusi++;
            }
            console.log(`Uusi issue'sid: ${uusi}`);
