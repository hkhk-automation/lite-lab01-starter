name: Ava ülesanded

# Loob .github/ulesanded.json põhjal issue'd (kontrollnimekiri).
# Käivitub õppija esimesel push'il; olemasolevaid issue'sid ei dubleeri.
# Käsitsi: Actions -> Ava ülesanded -> Run workflow.

on:
  push:
  workflow_dispatch:

permissions:
  issues: write
  contents: read

jobs:
  ava:
    runs-on: ubuntu-latest
    if: github.actor != 'github-classroom[bot]' && github.event.repository.is_template != true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const cfg = JSON.parse(fs.readFileSync('.github/ulesanded.json', 'utf8'));
            const { owner, repo } = context.repo;

            const sildid = [
              ['klassitöö', '1d76db'],
              ['kodutöö', 'fbca04'],
              ['abi', 'e11d21'],
            ];
            for (const [name, color] of sildid) {
              try { await github.rest.issues.createLabel({ owner, repo, name, color }); }
              catch (e) { if (e.status !== 422) throw e; }
            }

            // Nädala milestone'id (tudeng näeb Issues -> Milestones nädala kaupa)
            const mOlemas = await github.paginate(github.rest.issues.listMilestones,
              { owner, repo, state: 'all', per_page: 100 });
            const milestone = {};
            for (const [nr, n] of Object.entries(cfg.nadalad || {})) {
              let m = mOlemas.find(x => x.title === n.pealkiri);
              if (!m) {
                m = (await github.rest.issues.createMilestone({ owner, repo,
                  title: n.pealkiri, description: n.kirjeldus || '', due_on: n.tahtaeg })).data;
              }
              milestone[nr] = m.number;
            }

            const olemas = await github.paginate(github.rest.issues.listForRepo,
              { owner, repo, state: 'all', per_page: 100 });
            const issued = new Map(olemas.filter(i => !i.pull_request).map(i => [i.title, i]));

            let uusi = 0, maaratud = 0;
            for (const u of cfg.ulesanded) {
              const m = milestone[u.nadal];
              const i = issued.get(u.pealkiri);
              if (!i) {
                await github.rest.issues.create({
                  owner, repo, title: u.pealkiri, body: u.keha, labels: [u.silt], milestone: m,
                });
                uusi++;
              } else if (m && !i.milestone) {
                // juhendaja skriptiga loodud issue: lisa ainult milestone
                await github.rest.issues.update({ owner, repo, issue_number: i.number, milestone: m });
                maaratud++;
              }
            }
            console.log(`Uusi issue'sid: ${uusi}, milestone lisatud: ${maaratud}`);
